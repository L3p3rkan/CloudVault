version: "3.9"

# ============================================================
# Vault — docker-compose
#
# Quick-start (non-Unraid):
#   1. Copy .env.example to .env and fill in SESSION_SECRET
#   2. docker compose up -d
#   3. Open http://localhost:3000 — the database schema is
#      created automatically on first boot.
#      Log in with username "admin" / password "ChangeMe123!"
#      and change the password immediately.
# ============================================================

services:
  vault:
    image: vault:latest          # or your registry tag
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vault
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # ── Recommended ───────────────────────────────────────
      # Set SESSION_SECRET to a long random string (e.g. `openssl rand -hex 32`).
      # If omitted, a random secret is generated at startup — the app will work
      # but all sessions are invalidated on every container restart.
      SESSION_SECRET: "${SESSION_SECRET:-}"
      DATABASE_URL: "postgresql://vault:${POSTGRES_PASSWORD:-vaultpass}@db:5432/vault"

      # ── Optional ──────────────────────────────────────────
      # Override where uploaded files land inside the container.
      # On Unraid map this to a Share, e.g. /mnt/user/appdata/vault/uploads
      UPLOAD_DIR: "${UPLOAD_DIR:-/data/uploads}"

      # Set to "true" only when the app is behind a TLS-terminating reverse
      # proxy (HTTPS).  Leave unset for plain-HTTP LAN access (typical Unraid
      # setup) — enabling it over plain HTTP silently breaks login.
      # COOKIE_SECURE: "true"

      PORT: "3000"
      NODE_ENV: "production"
      STATIC_DIR: "/app/public"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: vault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vaultpass}"
      POSTGRES_DB: vault
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port exposed to the host for external DB tools (optional).
    # Safe to remove once you no longer need direct psql access.
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
    # Bind-mount override example (add to your .env or set here):
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /mnt/user/appdata/vault/uploads
  pgdata:
